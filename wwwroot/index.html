<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <!-- ── Top Navbar ── -->
    <nav class="navbar">
        <div class="nav-left">
            <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6" /><line x1="3" y1="12" x2="21" y2="12" /><line x1="3" y1="18" x2="21" y2="18" /></svg>
            </button>
            <div class="nav-logo">
                <div class="nav-logo-icon">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="10" /><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" /><line x1="12" y1="17" x2="12.01" y2="17" stroke-width="2.5" /></svg>
                </div>
                AI<span>App</span>
            </div>
        </div>
        <div class="nav-center">
            <div class="nav-tab active">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" /></svg>
                Chat
            </div>
            <div class="nav-tab">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="3" /><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14" /></svg>
                Explore
            </div>
            <div class="nav-tab">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 20h9" /><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" /></svg>
                History
            </div>
        </div>
        <div class="nav-right">
            <div class="model-pill">
                <span class="model-dot"></span>
                gpt-5.4-mini
            </div>
            <button class="nav-avatar" aria-label="Profile">U</button>
        </div>
    </nav>

    <!-- ── App shell ── -->
    <div class="app-shell">

        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-top">
                <button class="new-chat-btn" id="newChatBtn">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19" /><line x1="5" y1="12" x2="19" y2="12" /></svg>
                    New chat
                </button>
            </div>

            <div class="sidebar-section-label">Recent</div>
            <div class="history-list" id="historyList"></div>

            <div class="sidebar-footer">
                <div class="sidebar-footer-row">
                    <div class="status-dot"></div>
                    <span>Assistant online</span>
                </div>
                <div class="sidebar-endpoint">POST /api/AiChat</div>
            </div>
        </aside>

        <!-- Main content -->
        <main class="main">

            <!-- Empty state -->
            <div class="empty-state" id="emptyState">
                <div class="empty-icon">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="10" /><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" /><line x1="12" y1="17" x2="12.01" y2="17" stroke-width="2.2" /></svg>
                </div>
                <h2>How can I help you?</h2>
                <p>Ask me anything — connected to your AI backend.</p>
                <div class="chips">
                    <button class="chip" data-prompt="What are best practices for REST API design?">REST API best practices</button>
                    <button class="chip" data-prompt="Explain machine learning in simple terms">Explain machine learning</button>
                    <button class="chip" data-prompt="Write a professional email template for client outreach">Email template</button>
                    <button class="chip" data-prompt="What is the difference between SQL and NoSQL?">SQL vs NoSQL</button>
                </div>
            </div>

            <!-- Messages -->
            <div class="messages hidden" id="messagesList"></div>

            <!-- Input bar -->
            <div class="input-section">
                <div class="input-wrap">
                    <textarea id="promptInput" placeholder="Type your message…" rows="1"></textarea>
                    <button class="send-btn" id="sendBtn" disabled>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13" /><polygon points="22 2 15 22 11 13 2 9 22 2" /></svg>
                    </button>
                </div>
                <div class="input-footer">
                    <span class="input-hint">Enter to send &nbsp;·&nbsp; Shift+Enter for new line</span>
                    <span class="char-count" id="charCount"></span>
                </div>
            </div>

        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
